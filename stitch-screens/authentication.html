<body class="bg-background min-h-screen flex flex-col justify-center items-center p-md text-on-surface font-body-md">
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px]">
<!-- Logo / Brand -->
<div class="flex flex-col items-center mb-xl">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-primary text-2xl" style="font-variation-settings: 'FILL' 1;">
                    link
                </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed">Action Links</h1>
</div>
<!-- Auth Card -->
<div class="surface-card p-lg w-full flex flex-col gap-md">
<!-- Tabs -->
<div class="flex border-b border-surface-variant mb-md w-full">
<button class="flex-1 pb-sm font-label-md text-label-md text-primary border-b-2 border-primary text-center">
                    Sign In
                </button>
<button class="flex-1 pb-sm font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors text-center border-b-2 border-transparent">
                    Create Account
                </button>
</div>
<!-- Social Login -->
<button class="btn-secondary w-full flex items-center justify-center gap-sm py-sm rounded-lg font-label-md text-label-md transition-colors">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>

</svg>

            </button>
<!-- Divider -->
<div class="flex items-center w-full my-sm">
<div class="flex-grow h-px bg-surface-variant"></div>
<span class="px-sm font-label-sm text-label-sm text-on-surface-variant">Or continue with email</span>
<div class="flex-grow h-px bg-surface-variant"></div>
</div>
<!-- Form -->
<form class="flex flex-col gap-md w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<input class="input-field rounded-lg px-md py-sm font-body-md text-body-md bg-surface-container-lowest w-full transition-all" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center w-full">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<input class="input-field rounded-lg px-md py-sm font-body-md text-body-md bg-surface-container-lowest w-full transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="btn-primary w-full py-sm rounded-lg font-label-md text-label-md mt-sm transition-colors flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Footer Text -->
<div class="mt-sm text-center">
<p class="font-body-md text-body-md text-on-surface-variant">

</p>
