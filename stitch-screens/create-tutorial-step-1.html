<!-- Expanded Input Area (Hidden initially, simulated via CSS/JS below) -->

</div>

<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-md px-sm py-2 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" onclick="event.stopPropagation();" placeholder="https://docs.example.com..." type="text"/>
</div>
</button>

<div class="w-full flex justify-end mt-auto pt-xl border-t border-surface-variant">
<button class="bg-primary-container text-on-primary font-label-md text-label-md px-xl py-3 rounded-md opacity-50 cursor-not-allowed transition-all" disabled="" id="continue-btn">
                Continue
            </button>
</div>
</main>
<script>
        // Simple micro-interaction script to handle selection state
        const options = document.querySelectorAll('.source-option');
        const continueBtn = document.getElementById('continue-btn');

        options.forEach(option => {
            option.addEventListener('click', (e) => {
                // Reset all
                options.forEach(opt => {
                    opt.classList.remove('card-selected');
                    const inputArea = opt.querySelector('.input-area');
                    if(inputArea) inputArea.classList.add('hidden');
                });

                // Set active
                option.classList.add('card-selected');
                const activeInputArea = option.querySelector('.input-area');
                if(activeInputArea) {
                    activeInputArea.classList.remove('hidden');
                    // Focus the input if it exists
                    const input = activeInputArea.querySelector('input');
                    if(input) input.focus();
                }

                // Enable button
                continueBtn.disabled = false;
                continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                continueBtn.classList.add('hover:bg-surface-tint', 'active:scale-95');
            });
        });

        // Prevent button clicks from bubbling up to the option card if we added explicit buttons inside
        const innerInputs = document.querySelectorAll('.input-area input');
        innerInputs.forEach(input => {
            input.addEventListener('input', (e) => {
                // Could add validation logic here to enable/disable continue button based on input length
                if(e.target.value.length > 5) {
                     continueBtn.disabled = false;
                     continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        })
    </script>
